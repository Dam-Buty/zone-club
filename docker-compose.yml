services:
  app:
    build: .
    image: zone-app
    container_name: zone-app
    restart: unless-stopped
    working_dir: /app
    command: /app/scripts/docker-entrypoint.sh
    volumes:
      - .:/app
      - ./zone.db:/data/zone.db
      - /data/phat-two/zone-club-radarr:/media/library:rw
      - /data/big-boi/zone-club/films:/media/films:rw
      - /mnt/backup:/media/backup:rw,rshared
      - /home/damso/.ssh:/ssh-host:ro
      - media_public:/media/public:rw
    environment:
      - DATABASE_PATH=/data/zone.db
      - DOMAIN=${DOMAIN}
      - SUBDOMAIN=${SUBDOMAIN}
      - STORAGE_SUBDOMAIN=${STORAGE_SUBDOMAIN}
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY}
      - RADARR_QUALITY_PROFILE_ID=${RADARR_QUALITY_PROFILE_ID}
      - RADARR_QUALITY_PROFILE_ID_FR=${RADARR_QUALITY_PROFILE_ID_FR}
      - RADARR_ROOT_FOLDER=/data/phat-two/zone-club-radarr
      - DELETE_MKV_AFTER_BACKUP=false
      - SPARK_SSH_HOST=spark
      - SPARK_SSH_HOSTNAME=${SPARK_SSH_HOSTNAME}
      - SPARK_SSH_PORT=${SPARK_SSH_PORT}
      - SPARK_SSH_USER=${SPARK_SSH_USER}
      - GPU_ENCODE_PRESET=p5
      - GPU_ENCODE_CQ=23
      - GPU_MAX_HEIGHT=1080
      - MEDIA_FILMS_PATH=/media/films
      - MEDIA_LIBRARY_PATH=/media/library
      - MEDIA_BACKUP_PATH=/media/backup/zone-club
      - TMDB_API_KEY=${TMDB_API_KEY}
      - HMAC_SECRET=${HMAC_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CHAT_MODEL=${CHAT_MODEL}
      - API_SECRET=${API_SECRET}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
      - LANGFUSE_BASEURL=${LANGFUSE_BASEURL}
      - HOSTNAME=0.0.0.0
      - PORT=3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zone-app.rule=Host(`${SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.zone-app.entrypoints=websecure"
      - "traefik.http.routers.zone-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.zone-app.loadbalancer.server.port=3000"
    depends_on:
      - radarr


  storage:
    image: sebp/lighttpd
    container_name: zone-storage
    volumes:
      - /data/big-boi/zone-club/films:/media/films:ro
      - media_public:/media/public:ro
      - ./lighttpd.conf:/etc/lighttpd/lighttpd.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zone-storage.rule=Host(`${STORAGE_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.zone-storage.entrypoints=websecure"
      - "traefik.http.routers.zone-storage.tls.certresolver=letsencrypt"
      - "traefik.http.services.zone-storage.loadbalancer.server.port=80"


  radarr:
    image: linuxserver/radarr:latest
    container_name: zone-radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./radarr-vo-config:/config
      # Un SEUL bind, aux chemins identiques à ceux de l'hôte : la library et les
      # téléchargements partagent alors le même point de montage, condition
      # nécessaire aux liens durs — le noyau refuse link() entre deux mounts,
      # même sur le même disque (do_linkat: old_path.mnt != new_path.mnt → EXDEV).
      # Des chemins identiques rendent aussi les remote path mappings inutiles.
      - /data/phat-two:/data/phat-two
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"


  bazarr:
    image: linuxserver/bazarr:latest
    container_name: zone-bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./bazarr-config:/config
      - /data/big-boi/zone-club/films:/movies
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN}`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"


  cinema-stream:
    build: ./cinema-stream
    container_name: zone-cinema-stream
    volumes:
      - ./zone.db:/data/zone.db
      - /data/big-boi/zone-club/films:/media/films:ro
      - media_public:/media/public:rw
    environment:
      - DATABASE_PATH=/data/zone.db
      - FILMS_ROOT=/media/films
      - HLS_OUT_DIR=/media/public/symlinks/cinema-live
      - PLAYLIST_START=${PLAYLIST_START}
      - TZ=Europe/Paris


  zone-discord-bot:
    build: ./zone-discord-bot
    container_name: zone-discord-bot
    network_mode: host
    volumes:
      - ./zone.db:/data/zone.db:ro
      - /data/big-boi/zone-club/films:/media/films:ro
    environment:
      - DATABASE_PATH=/data/zone.db
      - FILMS_ROOT=/media/films
      - PLAYLIST_START=${PLAYLIST_START}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - DISCORD_VOICE_CHANNEL_ID=${DISCORD_VOICE_CHANNEL_ID}
      - TZ=Europe/Paris


volumes:
  media_public:
