server.document-root = "/media/public/symlinks"
server.port = 80

server.modules = (
    "mod_access",
    "mod_accesslog"
)

mimetype.assign = (
    ".mp4" => "video/mp4",
    ".webm" => "video/webm",
    ".vtt" => "text/vtt",
    ".srt" => "application/x-subrip",
    ".m3u8" => "application/vnd.apple.mpegurl",
    ".ts" => "video/mp2t"
)

server.follow-symlink = "enable"
server.range-requests = "enable"

server.modules += ("mod_setenv")
setenv.add-response-header = (
    "Access-Control-Allow-Origin" => "*",
    "Access-Control-Allow-Methods" => "GET, HEAD, OPTIONS",
    "Access-Control-Allow-Headers" => "Range"
)

# HLS en direct : les noms de segments (.ts) repartent à zéro à chaque restart de
# ffmpeg, et le .m3u8 change en continu. Sans Cache-Control, un client (Cytube,
# navigateur) peut resservir de vieux segments sous des noms réutilisés.
$HTTP["url"] =~ "\.(m3u8|ts)$" {
    setenv.add-response-header += (
        "Cache-Control" => "no-store, no-cache, must-revalidate"
    )
}

accesslog.filename = "/dev/stdout"
index-file.names = ()
dir-listing.activate = "disable"
